- insert:
    - id: sideroom
      name: '@rmrdeveloper/sideroom-dsh'
      config:
        guidelines:
          enabled: true
          gateUnrecognized: false
        rules:
          enabled: true
          blocking:
            - braced-conditionals
            - explicit-any
            - swallowed-errors
          notes:
            - clear-names
            - stale-comments
            - commented-code
            - debug-artifacts
            - suppressed-type-errors
          degradeAfter: 3
          resetAfter: 5
        review:
          enabled: true
        prompt:
          contract: true
          explain: true
        checks:
          enabled: true
        skills:
          enabled: true
          packaged: true
          monorepo: true
          maxDepth: 3
        jev:
          enabled: false
          keyEnv: TYPESAFE_API_KEY
          endpoint: https://api.typesafe.ai/v1/systemone
          model: jev-latest
          cutoff: 0.8
          gate: 0.6
          maxNotes: 3
          timeoutMs: 3000
          maxRelatedFiles: 4
          scanForConsumers: false
          reviewPlans: true
          reviewWorkflows: true
          calibrate: false
